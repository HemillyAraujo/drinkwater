<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Painel dos lembretes 💧</title>
<script src="config.js"></script>
<style>
  :root { --blue:#e75a9b; --deep:#8a2d5c; --bg:#fff5f9; --muted:#a0687f; --line:#f6d3e3; }
  * { box-sizing:border-box; accent-color:#e75a9b; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--deep); }
  main { max-width:640px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:26px; margin:0 0 4px; color:#d63f86; }
  h2 { font-size:17px; margin:0 0 12px; }
  .card { background:#fff; border:1px solid #fbd3e5; border-radius:22px; padding:18px; margin:16px 0; box-shadow:0 4px 18px rgba(200,60,130,.06); }
  label { display:block; font-size:14px; font-weight:600; margin:12px 0 6px; }
  input[type=text], input[type=password], input[type=number], input[type=time], select, textarea {
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; font-family:inherit; color:inherit; background:#fff; }
  textarea { resize:vertical; min-height:56px; }
  .row { display:flex; gap:12px; } .row > * { flex:1; }
  .btn { border:0; border-radius:999px; padding:12px 16px; font-size:15px; font-weight:600; background:var(--blue); color:#fff; cursor:pointer; }
  .btn.ghost { background:#fde4ef; color:var(--deep); }
  .btn.danger { background:#fde8e7; color:#b3261e; }
  .btn:disabled { opacity:.6; }
  .days { display:flex; flex-wrap:wrap; gap:6px; }
  .days label { margin:0; font-weight:500; background:#fdebf3; border-radius:999px; padding:7px 12px; cursor:pointer; user-select:none; }
  .days input { margin-right:4px; }
  .switch { display:flex; align-items:center; gap:10px; font-weight:600; }
  .switch input { width:22px; height:22px; }
  .rem { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; display:flex; gap:12px; }
  .rem .thumb { width:84px; height:84px; flex:none; border-radius:10px; background:#fdebf3 center/cover no-repeat;
                display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center; cursor:pointer; }
  .rem .body { flex:1; display:flex; flex-direction:column; gap:8px; }
  .rem .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .rem .actions .btn { padding:7px 10px; font-size:13px; }
  .bar { position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 30%); padding:20px 0 12px; display:flex; gap:10px; }
  .bar .btn { flex:1; padding:15px; font-size:16px; }
  .muted { color:var(--muted); font-size:13px; }
  #toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:var(--deep); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; z-index:9; max-width:90%; }
  .hidden { display:none; }
  /* ---- tema escuro ---- */
  @media (prefers-color-scheme: dark) {
    :root { --blue:#f7a8cb; --deep:#ffd9ea; --bg:#1c1218; --muted:#c99bb1; --line:#4a2c3c; color-scheme:dark; }
    * { accent-color:#f7a8cb; }
    h1 { color:#ffb6d5; }
    .card { background:#2a1b24; border-color:#4a2c3c; box-shadow:0 4px 18px rgba(0,0,0,.35); }
    input[type=text], input[type=password], input[type=number], input[type=time], select, textarea { background:#211620; }
    .btn { color:#4a1530; }
    .btn.ghost { background:#3d2632; color:var(--deep); }
    .btn.danger { background:#4a2026; color:#ff9c95; }
    .days label, .rem .thumb { background-color:#3d2632; }
    #toast { background:#ffd9ea; color:#4a1530; }
  }

</style>
</head>
<body>
<div id="toast"></div>
<main>
  <h1>Painel dos lembretes 🎀</h1>
  <p class="muted">Aqui você escolhe o que aparece pra ela e de quanto em quanto tempo.</p>

  <div class="card" id="login">
    <h2>Entrar</h2>
    <label for="pw">Senha do painel</label>
    <input type="password" id="pw" autocomplete="current-password">
    <p><button class="btn" id="loginBtn">Entrar</button></p>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="switch"><input type="checkbox" id="enabled"><label for="enabled" style="margin:0">Lembretes ligados</label></div>
      <p class="muted" id="status" style="margin-bottom:0"></p>
    </div>

    <div class="card">
      <h2>Frequência e horários</h2>
      <label for="interval">De quanto em quanto tempo</label>
      <div class="row">
        <select id="intervalPreset">
          <option value="30">A cada 30 minutos</option>
          <option value="45">A cada 45 minutos</option>
          <option value="60">A cada 1 hora</option>
          <option value="90">A cada 1h30</option>
          <option value="120">A cada 2 horas</option>
          <option value="180">A cada 3 horas</option>
          <option value="custom">Personalizado…</option>
        </select>
        <input type="number" id="interval" min="5" max="1440" placeholder="minutos" class="hidden">
      </div>
      <div class="row">
        <div><label for="start">Começa às</label><input type="time" id="start"></div>
        <div><label for="end">Para às</label><input type="time" id="end"></div>
      </div>
      <label>Dias da semana</label>
      <div class="days" id="days"></div>
    </div>

    <div class="card">
      <h2>Aparência</h2>
      <label for="herName">Como chamar ela no app</label>
      <input type="text" id="herName" maxlength="40" placeholder="ex.: amor, Ana, princesa">
      <label for="title">Título da notificação</label>
      <input type="text" id="title" maxlength="60">
      <label for="mode">Ordem das mensagens</label>
      <select id="mode">
        <option value="random">Aleatória</option>
        <option value="sequence">Em sequência</option>
      </select>
    </div>

    <div class="card">
      <h2>Mensagens</h2>
      <p class="muted" style="margin-top:0">Toque no quadrado para adicionar uma foto. A foto aparece no app quando ela abre a notificação.</p>
      <div id="reminders"></div>
      <button class="btn ghost" id="addRem">+ Adicionar mensagem</button>
    </div>

    <div class="card">
      <h2>Celulares conectados</h2>
      <p class="muted" id="devices" style="margin-top:0"></p>
      <button class="btn danger" id="clearDevices">Desconectar todos</button>
    </div>

    <div class="bar">
      <button class="btn ghost" id="testBtn">Enviar teste agora</button>
      <button class="btn" id="saveBtn">Salvar</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" class="hidden">
</main>

<script>
const API = window.WORKER_URL;
const $ = (id) => document.getElementById(id);
let password = "";
try { password = localStorage.getItem("adminpw") || ""; } catch (e) {}
let settings = null;

function toast(t, ms = 2600) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => (el.style.display = "none"), ms); }
async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + password, ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Erro " + res.status), { status: res.status });
  return data;
}

// ---- login ----
async function login() {
  try {
    const d = await api("/api/admin/settings");
    try { localStorage.setItem("adminpw", password); } catch (e) {}
    $("login").classList.add("hidden"); $("panel").classList.remove("hidden");
    fill(d);
  } catch (e) {
    $("login").classList.remove("hidden"); $("panel").classList.add("hidden");
    if (password) toast(e.status === 401 ? "Senha incorreta" : "Não consegui falar com o servidor: " + e.message);
  }
}
$("loginBtn").onclick = () => { password = $("pw").value; login(); };
$("pw").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };

// ---- formulário ----
const DAY_NAMES = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
function photoUrl(id) { return id ? `${API}/api/photo/${id}` : null; }

function fill(d) {
  settings = d.settings;
  $("enabled").checked = settings.enabled;
  const presets = ["30", "45", "60", "90", "120", "180"];
  const iv = String(settings.intervalMinutes);
  $("intervalPreset").value = presets.includes(iv) ? iv : "custom";
  $("interval").value = iv;
  $("interval").classList.toggle("hidden", presets.includes(iv));
  $("start").value = settings.startTime; $("end").value = settings.endTime;
  $("herName").value = settings.herName; $("title").value = settings.title; $("mode").value = settings.mode;
  $("days").innerHTML = DAY_NAMES.map((n, i) =>
    `<label><input type="checkbox" value="${i}" ${settings.days.includes(i) ? "checked" : ""}>${n}</label>`).join("");
  $("devices").textContent = d.devices === 0
    ? "Nenhum celular conectado ainda. Ela precisa abrir o app e tocar em \"Ativar lembretes\"."
    : `${d.devices} celular(es) recebendo lembretes.`;
  $("status").textContent = d.lastSentAt ? "Último lembrete enviado: " + new Date(d.lastSentAt).toLocaleString("pt-BR") : "Nenhum lembrete enviado ainda.";
  renderReminders();
}
$("intervalPreset").onchange = () => {
  const custom = $("intervalPreset").value === "custom";
  $("interval").classList.toggle("hidden", !custom);
  if (!custom) $("interval").value = $("intervalPreset").value; else $("interval").focus();
};

function renderReminders() {
  const box = $("reminders");
  box.innerHTML = "";
  settings.reminders.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "rem";
    const url = photoUrl(r.photoId);
    el.innerHTML = `
      <div class="thumb" style="${url ? `background-image:url('${url}')` : ""}">${url ? "" : "📷<br>Adicionar foto"}</div>
      <div class="body">
        <textarea maxlength="200" placeholder="Escreva a mensagem…"></textarea>
        <div class="actions">
          ${url ? '<button class="btn ghost" data-act="rmphoto">Tirar foto</button>' : ""}
          <button class="btn danger" data-act="del">Excluir</button>
        </div>
      </div>`;
    const ta = el.querySelector("textarea");
    ta.value = r.text;
    ta.oninput = () => (r.text = ta.value);
    el.querySelector(".thumb").onclick = () => pickPhoto(r);
    el.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => {
      if (b.dataset.act === "del") { settings.reminders.splice(i, 1); }
      else { r.photoId = null; }
      renderReminders();
    }));
    box.appendChild(el);
  });
}
$("addRem").onclick = () => {
  settings.reminders.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), text: "", photoId: null });
  renderReminders();
  const tas = $("reminders").querySelectorAll("textarea"); tas[tas.length - 1].focus();
};

// ---- fotos: reduz no navegador antes de enviar ----
let photoTarget = null;
function pickPhoto(r) { photoTarget = r; $("fileInput").value = ""; $("fileInput").click(); }
$("fileInput").onchange = async () => {
  const file = $("fileInput").files[0];
  if (!file || !photoTarget) return;
  toast("Enviando foto…", 10000);
  try {
    const blob = await resize(file, 1080);
    const d = await api("/api/admin/photo", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    photoTarget.photoId = d.photoId;
    renderReminders();
    toast("Foto adicionada! Lembre de salvar.");
  } catch (e) { toast("Não deu pra enviar a foto: " + e.message); }
};
function resize(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("falha ao processar"))), "image/jpeg", 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("formato de imagem não suportado"));
    img.src = URL.createObjectURL(file);
  });
}

// ---- salvar / testar ----
function collect() {
  return {
    ...settings,
    enabled: $("enabled").checked,
    intervalMinutes: parseInt($("intervalPreset").value === "custom" ? $("interval").value : $("intervalPreset").value, 10),
    startTime: $("start").value, endTime: $("end").value,
    days: [...$("days").querySelectorAll("input:checked")].map((i) => +i.value),
    herName: $("herName").value.trim(), title: $("title").value.trim(), mode: $("mode").value,
    reminders: settings.reminders.filter((r) => r.text.trim()),
  };
}
async function save() {
  const data = collect();
  if (!data.intervalMinutes || data.intervalMinutes < 5) { toast("O intervalo mínimo é 5 minutos."); return false; }
  if (!data.days.length) { toast("Escolha pelo menos um dia."); return false; }
  if (!data.reminders.length) { toast("Escreva pelo menos uma mensagem."); return false; }
  $("saveBtn").disabled = true;
  try {
    const d = await api("/api/admin/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    settings = d.settings; renderReminders();
    toast("Salvo! 💖"); return true;
  } catch (e) { toast("Erro ao salvar: " + e.message); return false; }
  finally { $("saveBtn").disabled = false; }
}
$("saveBtn").onclick = save;
$("testBtn").onclick = async () => {
  if (!(await save())) return;
  $("testBtn").disabled = true;
  try {
    const d = await api("/api/admin/test", { method: "POST" });
    toast(d.devices ? `Teste enviado para ${d.sent} de ${d.devices} celular(es).` : "Nenhum celular conectado ainda.", 4000);
  } catch (e) { toast("Erro no teste: " + e.message); }
  finally { $("testBtn").disabled = false; }
};
$("clearDevices").onclick = async () => {
  if (!window.confirm || !confirm("Desconectar todos os celulares? Ela vai precisar ativar os lembretes de novo.")) return;
  try { await api("/api/admin/devices", { method: "DELETE" }); toast("Desconectados."); login(); } catch (e) { toast(e.message); }
};

if (password) login();
</script>
</body>
</html>
